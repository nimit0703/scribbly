spring.application.name=scribbly
spring.main.banner-mode=off
server.port=8080

# Game timings (per-room options such as rounds and draw time are set in the lobby)
game.choose-seconds=15
game.turn-end-seconds=6
game.game-over-seconds=10
game.public-max-players=8
game.dictionary-file=static/words.txt
# Comma-separated origin patterns allowed to open the WebSocket, e.g. https://play.example.com
game.allowed-origins=*

logging.level.root=INFO
logging.level.com.scribb.game=INFO

management.endpoints.web.exposure.include=health,info
