spring.main.banner-mode=off
spring.main.log-startup-info=false

# ===============================
# Production profile settings
# ===============================
spring.profiles.active=prod

# ===============================
# Application Info
# ===============================
spring.application.name=scribb-game

# ===============================
# WebSocket Configuration
# ===============================
spring.websocket.allowed-origins=*

# ===============================
# Game Configuration
# ===============================
game.round.duration-seconds=60
game.round.min-players=2
game.round.max-players=8
game.round.total-rounds=3

game.scoring.max-bonus=100
game.scoring.min-bonus=10
game.scoring.drawer-bonus-per-guesser=10

game.timer.broadcast-interval-ms=1000
game.timer.hint-interval-seconds=10

game.word.options-count=3
game.word.dictionary-file=static/words.txt

# ===============================
# Logging Configuration
# ===============================
logging.level.root=INFO
logging.level.com.scribb.game=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# Actuator Configuration
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=scribb-game
